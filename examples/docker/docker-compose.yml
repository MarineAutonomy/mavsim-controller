# Run the mavsim bridge and your controller as two containers that share local
# ROS2 (via host networking, so DDS discovery works between them).
#
# LINUX: works as-is (host networking + matching ROS_DOMAIN_ID).
# macOS / Windows: Docker Desktop does not give containers real host networking,
#   so ROS2 discovery across containers needs a Fast DDS Discovery Server. See
#   the note at the bottom of this file.
#
# Usage:
#   export CONTROLLER_CODE=ABC123
#   export BACKEND_URL=http://localhost:5000     # or your cloud backend
#   export VESSEL=matsya_01                       # the vessel you control
#   docker compose up --build
#
# Build context is the user_repo_new root (..//..) so the controller image can
# see ./interfaces and ./examples.

services:
  bridge:
    image: mavlab/mavsim-controller:latest
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - MAVSIM_CMD_TIMEOUT=1.0
      # Uncomment to also expose read-only telemetry for vessels you do NOT own:
      # - MAVSIM_OBSERVE_OTHERS=1
    volumes:
      - ../../bridge_controller.py:/app/user_code/my_controller.py:ro
      - ../../recordings:/tmp/mavsim_bags
    command:
      - "--code"
      - "${CONTROLLER_CODE}"
      - "--backend-url"
      - "${BACKEND_URL:-http://localhost:5000}"
      - "--rate"
      - "${RATE:-10}"

  controller:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile.user
    network_mode: host
    depends_on:
      - bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    command:
      - "--vessel"
      - "${VESSEL:-matsya_01}"
      - "--cs"
      - "${CS:-cs_01}"
      - "--th"
      - "${TH:-th_01}"

# macOS / Windows note:
#   Replace `network_mode: host` on both services with a shared user-defined
#   network and run a Fast DDS Discovery Server, e.g.:
#     1) add a `discovery` service running `fastdds discovery -i 0`
#     2) set on bridge + controller:
#          ROS_DISCOVERY_SERVER=discovery:11811
#     3) put all three services on the same `networks:` entry.
#   This makes DDS use unicast discovery instead of multicast.
